<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - DateScape</title>
</head>

<body
    style="margin: 0; padding: 0; background-color: #f4f5f7; font-family: Arial, Helvetica, sans-serif; color: #333333;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0"
        style="background-color: #f4f5f7; min-height: 100vh; padding: 40px 20px;">
        <tr>
            <td align="center" valign="middle">

                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                    style="max-width: 560px; background-color: #ffffff; border-radius: 12px; overflow: hidden;">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 32px 30px 20px;">
                            <h1 style="margin: 0; font-size: 30px; color: #6c63ff;">
                                DateScape
                            </h1>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td align="center" style="padding: 20px 40px 45px;">

                            <!-- Success Icon -->
                            <div style="
                                width: 70px;
                                height: 70px;
                                margin: 0 auto 25px;
                                border-radius: 50%;
                                background-color: #e8f7ee;
                                line-height: 70px;
                                font-size: 36px;
                                color: #28a745;
                            ">
                                ✓
                            </div>

                            <h2 style="
                                margin: 0 0 16px;
                                font-size: 26px;
                                color: #222222;
                            ">
                                Email verified!
                            </h2>

                            <p style="
                                margin: 0 auto 12px;
                                max-width: 420px;
                                font-size: 16px;
                                line-height: 1.6;
                                color: #555555;
                            ">
                                Your email address has been successfully verified.
                            </p>

                            <p style="
                                margin: 0 auto 30px;
                                max-width: 420px;
                                font-size: 16px;
                                line-height: 1.6;
                                color: #555555;
                            ">
                                Your DateScape account is now ready to use.
                            </p>

                            <!-- Login Button -->
                            <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto;">
                                <tr>
                                    <td align="center" style="border-radius: 8px; background-color: #6c63ff;">
                                        <a href="{{FRONTEND_URL}}/login" style="
                                                display: inline-block;
                                                padding: 14px 30px;
                                                font-size: 16px;
                                                font-weight: bold;
                                                color: #ffffff;
                                                text-decoration: none;
                                                border-radius: 8px;
                                            ">
                                            Go to DateScape
                                        </a>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="
                                padding: 20px 30px;
                                background-color: #fafafa;
                                border-top: 1px solid #eeeeee;
                            ">
                            <p style="
                                margin: 0;
                                font-size: 12px;
                                color: #999999;
                            ">
                                © DateScape. All rights reserved.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
